
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Source
        run: unzip -o OfertaA4-Android-Source.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check or Install Android SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "sdkmanager not found: $SDKMANAGER"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfertaA4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
